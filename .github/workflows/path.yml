name: Windows path diagnostic
on: [push]
jobs:
  paths:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - shell: bash
        run: |
          cat > path.jl <<'JULIA'
          using SHA
          mktempdir() do root
              workspace = joinpath(root, "workspace")
              mkpath(workspace)
              original = realpath(workspace)
              command = Cmd(`$(Base.julia_cmd()) --startup-file=no -e 'using SHA; x=pwd(); println("child=", repr(x), " hash=", bytes2hex(sha256(abspath(x)))[1:24])'`; dir=workspace)
              println("parent=", repr(original), " hash=", bytes2hex(sha256(abspath(original)))[1:24])
              run(command)
          end
          JULIA
          julia --startup-file=no path.jl
