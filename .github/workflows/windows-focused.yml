name: Windows session discovery
on: [push]
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); include("test/session_corrupt.jl")'
