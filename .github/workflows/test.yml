name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Keep Julia depot stable across HOME changes
        env:
          DEPOT: ${{ runner.temp }}/julia-depot
        run: printf 'JULIA_DEPOT_PATH=%s\n' "$DEPOT" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Install Pi search tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - name: Install Pi search tools on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep fd
      - name: Prepare pinned Pi reference
        run: |
          git clone --filter=blob:none https://github.com/earendil-works/pi.git "$RUNNER_TEMP/pi-source"
          git -C "$RUNNER_TEMP/pi-source" checkout --detach e7a0df27c09d11bf4161d3605246cbf57a129cb2
          npm install --prefix "$RUNNER_TEMP/pi-deps" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          node -e "require('fs').symlinkSync(process.argv[1], process.argv[2], 'junction')" "$RUNNER_TEMP/pi-deps/node_modules" "$RUNNER_TEMP/pi-source/node_modules"
      - name: Julia tests and differential cases
        env:
          PI_SOURCE: ${{ runner.temp }}/pi-source
          JULIA_NUM_THREADS: 4
        run: julia --startup-file=no --project=. scripts/ci.jl
