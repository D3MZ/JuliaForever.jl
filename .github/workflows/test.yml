name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - name: Test coverage report
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Prepare pinned Pi reference
        run: |
          git clone --filter=blob:none https://github.com/earendil-works/pi.git "$RUNNER_TEMP/pi-source"
          git -C "$RUNNER_TEMP/pi-source" checkout --detach e7a0df27c09d11bf4161d3605246cbf57a129cb2
          npm install --prefix "$RUNNER_TEMP/pi-deps" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          node -e "require('fs').symlinkSync(process.argv[1], process.argv[2], 'junction')" "$RUNNER_TEMP/pi-deps/node_modules" "$RUNNER_TEMP/pi-source/node_modules"
      - name: Julia tests and differential cases
        env:
          PI_SOURCE: ${{ runner.temp }}/pi-source
          JULIA_NUM_THREADS: 4
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            julia --startup-file=no --project=. scripts/ci.jl --coverage
          else
            julia --startup-file=no --project=. scripts/ci.jl
          fi
      - name: Summarize coverage
        if: runner.os == 'Linux'
        run: python3 scripts/coverage.py --output coverage/report.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: julia-coverage
          path: |
            coverage/report.json
            src/**/*.cov
          if-no-files-found: error
