name: Pinned Pi search
on: [push]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: 4
      PI_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '25'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep fd-find
      - run: |
          echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/julia-depot" >> "$GITHUB_ENV"
          echo "PI_SOURCE=$RUNNER_TEMP/pi-source" >> "$GITHUB_ENV"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"
          PI_SOURCE="$RUNNER_TEMP/pi-source"
          git clone --filter=blob:none https://github.com/earendil-works/pi.git "$PI_SOURCE"
          git -C "$PI_SOURCE" checkout --detach e7a0df27c09d11bf4161d3605246cbf57a129cb2
          npm install --prefix "$RUNNER_TEMP/pi-deps" --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@1.4.0
          node -e "require('fs').symlinkSync(process.argv[1], process.argv[2], 'junction')" "$RUNNER_TEMP/pi-deps/node_modules" "$PI_SOURCE/node_modules"
      - run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate(); using Test, JuliaForever, JSON3; include("test/search.jl"); include("test/search_differential.jl")'
